<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Tab4U Transposer</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      width: 220px;
      margin: 0;
      padding: 14px;
      background: #1e293b;
      color: #f8fafc;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      text-align: center;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      flex: 0 0 auto;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #reset {
      width: 100%;
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    #reset:hover { background: #334155; color: #fff; }
    #value {
      flex: 1;
      text-align: center;
      font-weight: bold;
      color: #facc15;
      font-size: 15px;
    }
    p.hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>טרנספוזיציית אקורדים - Tab4U</h1>
  <div class="row">
    <button id="down">♭ −</button>
    <span id="value">מקורי</span>
    <button id="up">+ ♯</button>
  </div>
  <button id="reset">איפוס</button>
  <p class="hint">אפשר גם לגרור את החלון הצף בעמוד השיר עצמו</p>
  <script src="popup.js"></script>
</body>
</html>
